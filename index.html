<style>
:root{

  --blue:#b7d8f6;
}
*{box-sizing:border-box;font-family:system-ui,Arial}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--pink),var(--blue));
}
.app{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 16px 32px rgba(0,0,0,.15);
}
h1,h2,p{text-align:center;margin:0 0 12px}
p{color:#555}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:none;
  border-radius:16px;
  font-size:1rem;
  cursor:pointer;
}
.btn-main{background:linear-gradient(135deg,var(--pink),var(--blue))}
.btn-wa{background:#25D366;color:#fff}
.btn-copy{background:#eee}
.btn-download{background:#ffeef4}
.progress{height:8px;background:#eee;border-radius:8px;margin-bottom:12px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--blue))}
.logo{text-align:center;margin-bottom:16px}
.logo img{width:72px;height:72px}
.card{border-radius:20px;padding:24px;text-align:center}
.note{font-size:.8rem;color:#777;text-align:center}
</style>

/* ================= QUIZ ================= */
var questions=[
 {q:"Qual sua idade?",o:[["Menos de 25",-1],["25 a 34",2],["35 ou mais",-1]]},
 {q:"Em que mês engravidou?",o:[["Jan a Abr",2],["Mai a Ago",-2],["Set a Dez",1]]},
 {q:"Desejo maior?",o:[["Doce 🍰",-2],["Salgado 🧂",2],["Equilibrado",0]]},
 {q:"Formato da barriga?",o:[["Pontuda",2],["Redonda",-2],["Não sei",0]]},
 {q:"Batimentos do bebê?",o:[["Rápidos",-2],["Calmos",2],["Não sei",0]]}
];

var app=document.getElementById("app");
var index=0, score=0;

function start(){
 app.innerHTML=
 "<div class='logo'>"+
 "<img src='"+LOGO_BASE64+"'><br>"+
 "<strong>"+APP_NAME+"</strong><br>"+
 "<span class='note'>"+SLOGAN+"</span>"+
 "</div>"+
 "<p>Descubra o sexo do seu bebê 👶</p>"+
 "<button class='btn-main' onclick='showQuestion()'>Começar</button>";
}

function showQuestion(){
 var q=questions[index];
 var progress=(index/questions.length)*100;
 var html=
 "<div class='progress'><div class='progress-bar' style='width:"+progress+"%'></div></div>"+
 "<p>Pergunta "+(index+1)+" de "+questions.length+"</p>"+
 "<h2>"+q.q+"</h2>";
 q.o.forEach(o=>{
  html+="<button class='btn-main' onclick='answer("+o[1]+")'>"+o[0]+"</button>";
 });
 app.innerHTML=html;
}

function answer(v){
 score+=v;
 index++;
 index<questions.length ? showQuestion() : loading();
}

function loading(){
 app.innerHTML="<p>Analisando com carinho 💗</p>";
 setTimeout(showResult,1800);
}

function showResult(){
 var boy=score>0;
 var result=boy?"MENINO 👶💙":"MENINA 👶💗";
 var chance=Math.floor(Math.random()*26)+70;
 var message=
 "Fiz um teste divertido do meu bebê 💕👶\n\n"+
 result+" ("+chance+"%)\n\n"+
 "Descubra o seu também 👉 "+location.href;

 app.innerHTML=
 "<div class='card'>"+
 "<img src='"+LOGO_BASE64+"' style='width:56px'><br>"+
 "<strong>"+APP_NAME+"</strong>"+
 "<h1>"+result+"</h1>"+
 "<p>"+chance+"% de chance</p>"+
 "<p class='note'>"+SLOGAN+"</p>"+
 "</div>"+
 "<button class='btn-wa' onclick='shareWhats(message)'>Compartilhar no WhatsApp</button>"+
 "<button class='btn-copy' onclick='copyText(message)'>Copiar texto</button>"+
 "<button class='btn-download' onclick='downloadStory(result,chance)'>Baixar card para Stories</button>"+
 "<button class='btn-main' onclick='start()'>Refazer teste</button>";
}

/* ================= AÇÕES ================= */
function shareWhats(t){
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
function copyText(t){
 navigator.clipboard.writeText(t).then(()=>alert("Texto copiado! Agora é só colar nos Stories 😊"));
}

/* ================= CANVAS STORIES ================= */
function downloadStory(result,chance){
 var c=document.createElement("canvas");
 c.width=1080; c.height=1920;
 var ctx=c.getContext("2d");

 var grad=ctx.createLinearGradient(0,0,0,1920);
 grad.addColorStop(0,result.includes("MENINO")?"#b7d8f6":"#f6b7c5");
 grad.addColorStop(1,"#fff");
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,1080,1920);

 var img=new Image();
 img.src=LOGO_BASE64;
 img.onload=function(){
  ctx.textAlign="center";
  ctx.drawImage(img,460,120,160,160);
