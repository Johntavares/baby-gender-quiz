<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meu bebê 👶</title>

<style>
:root{
  --pink:#f6b7c5;
  --blue:#b7d8f6;
  --radius:22px;
}
*{box-sizing:border-box;font-family:system-ui,Arial}
body{
  margin:0;min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  background:linear-gradient(135deg,var(--pink),var(--blue));
}
.app{
  width:100%;max-width:420px;
  background:#fff;border-radius:var(--radius);
  padding:24px;
  box-shadow:0 16px 32px rgba(0,0,0,.15);
}
h1,h2,h3,p{text-align:center;margin:0 0 12px}
p{color:#555}
.logo{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:16px;
}
.logo img{width:72px;height:72px;margin-bottom:6px}
button{
  width:100%;padding:14px;margin-top:8px;
  border:none;border-radius:16px;
  font-size:1rem;cursor:pointer;
}
.btn-main{background:linear-gradient(135deg,var(--pink),var(--blue))}
.btn-wa{background:#25D366;color:#fff}
.btn-fb{background:#1877F2;color:#fff}
.btn-x{background:#000;color:#fff}
.btn-copy{background:#eee;color:#333}
.btn-download{background:#ffeef4;color:#333}
.progress{height:8px;background:#eee;border-radius:8px;margin-bottom:12px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--blue))}
.card{border-radius:20px;padding:26px;text-align:center}
.note{font-size:.8rem;color:#777}
</style>
</head>

<body>
<div id="app" class="app"></div>

<script>
/* ================= BRAND ================= */
var APP_NAME = "meu bebê";
var SLOGAN = "uma brincadeira cheia de amor";

/* Logo placeholder embutida (troque por Base64 da sua logo quando quiser) */
var LOGO_BASE64 =
"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgdmlld0JveD0iMCAwIDEyMCAxMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iNjAiIGN5PSI2MCIgcj0iNjAiIGZpbGw9IiNmNmI3YzUiLz48dGV4dCB4PSI2MCIgeT0iNzAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iNDgiIGZpbGw9IiNmZmYiPvCfkbo8L3RleHQ+PC9zdmc+";

/* ================= DATA ================= */
var questions=[
 {q:"Qual sua idade?",o:[["Menos de 25",-1],["25 a 34",2],["35 ou mais",-1]]},
 {q:"Em que mês engravidou?",o:[["Jan a Abr",2],["Mai a Ago",-2],["Set a Dez",1]]},
 {q:"Desejo maior?",o:[["Doce 🍰",-2],["Salgado 🧂",2],["Equilibrado",0]]},
 {q:"Formato da barriga?",o:[["Pontuda",2],["Redonda",-2],["Não sei",0]]},
 {q:"Batimentos do bebê?",o:[["Rápidos",-2],["Calmos",2],["Não sei",0]]}
];

var app=document.getElementById("app");
var idx=0, score=0;

/* ================= FLOW ================= */
function start(){
 app.innerHTML=
 "<div class='logo'>"+
 "<img src='"+LOGO_BASE64+"'>"+
 "<strong>"+APP_NAME+"</strong>"+
 "<span class='note'>"+SLOGAN+"</span>"+
 "</div>"+
 "<p>Descubra o sexo do seu bebê 👶</p>"+
 "<button class='btn-main' onclick='quiz()'>Começar</button>";
}

function quiz(){
 var q=questions[idx];
 var p=(idx/questions.length)*100;
 var h=
 "<div class='progress'><div class='progress-bar' style='width:"+p+"%'></div></div>"+
 "<p>Pergunta "+(idx+1)+" de "+questions.length+"</p>"+
 "<h2>"+q.q+"</h2>";
 q.o.forEach(o=>h+="<button class='btn-main' onclick='ans("+o[1]+")'>"+o[0]+"</button>");
 app.innerHTML=h;
}

function ans(v){
 score+=v; idx++;
 idx<questions.length ? quiz() : load();
}

function load(){
 app.innerHTML="<h3>Analisando com carinho 💗</h3><p>Aguarde…</p>";
 setTimeout(result,1800);
}

function result(){
 var boy=score>0;
 var r=boy?"MENINO 👶💙":"MENINA 👶💗";
 var c=Math.floor(Math.random()*26)+70;
 var phrase=boy?"Um pequeno herói está a caminho 💙":"Uma princesinha cheia de amor 💗";
 var bg=boy?"linear-gradient(135deg,#b7d8f6,#eef6ff)":"linear-gradient(135deg,#f6b7c5,#ffeef3)";
 var text="Meu teste do "+APP_NAME+" deu "+r+" ("+c+"%) 😍👶\n\nDescubra o seu também 👉 "+location.href;

 app.innerHTML=
 "<div class='card' style='background:"+bg+"'>"+
 "<img src='"+LOGO_BASE64+"' style='width:56px;margin-bottom:8px'>"+
 "<p class='note'>"+APP_NAME+"</p>"+
 "<h1>"+r+"</h1>"+
 "<p>"+phrase+"</p>"+
 "<p><strong>"+c+"% de chance</strong></p>"+
 "<p class='note'>"+SLOGAN+"</p>"+
 "</div>"+
 "<button class='btn-wa' onclick='wa(text)'>WhatsApp</button>"+
 "<button class='btn-copy' onclick='copy(text)'>Copiar texto</button>"+
 "<button class='btn-download' onclick='story(r,c)'>Baixar card para Stories</button>"+
 "<button class='btn-main' onclick='start()'>Refazer teste</button>";
}

/* ================= SHARE ================= */
function wa(t){window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
function copy(t){navigator.clipboard.writeText(t).then(()=>alert("Texto copiado!"))}

/* ================= STORY IMG ================= */
function story(r,c){
 var cv=document.createElement("canvas"),w=1080,h=1920;
 cv.width=w;cv.height=h;
 var x=cv.getContext("2d");
 var boy=r.includes("MENINO");
 var g=x.createLinearGradient(0,0,0,h);
 g.addColorStop(0,boy?"#b7d8f6":"#f6b7c5");
 g.addColorStop(1,"#fff");
 x.fillStyle=g;x.fillRect(0,0,w,h);
 x.textAlign="center";

 var img=new Image();
 img.src=LOGO_BASE64;
 img.onload=function(){
   x.drawImage(img,w/2-80,80,160,160);
   x.font="bold 48px system-ui";x.fillText(APP_NAME,w/2,280);
   x.font="36px system-ui";x.fillText(SLOGAN,w/2,330);
   x.font="140px system-ui";x.fillText("👶",w/2,540);
   x.font="bold 96px system-ui";x.fillText(r,w/2,760);
   x.font="56px system-ui";x.fillText(c+"% de chance",w/2,880);
   x.font="44px system-ui";x.fillText("Descubra o seu também",w/2,1040);
   var a=document.createElement("a");
   a.download="meu-bebe-stories.png";
   a.href=cv.toDataURL("image/png");
   a.click();
 };
}

start();
</script>
</body>
</html>
