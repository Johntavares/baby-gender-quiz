<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Descubra o sexo do seu bebê 👶</title>

<style>
:root{
  --pink:#f6b7c5;
  --blue:#b7d8f6;
  --radius:22px;
}

*{box-sizing:border-box;font-family:system-ui,Arial}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,var(--pink),var(--blue));
}

.app{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:var(--radius);
  padding:24px;
  box-shadow:0 16px 32px rgba(0,0,0,.15);
}

h1,h2,h3,p{text-align:center;margin:0 0 12px}
p{color:#555}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:16px;
  font-size:1rem;
  background:linear-gradient(135deg,var(--pink),var(--blue));
  cursor:pointer;
}

.progress{
  height:8px;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:12px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--pink),var(--blue));
}

.card-viral{
  border-radius:20px;
  padding:26px;
  text-align:center;
}

.share-buttons button{
  background:#f0f0f0;
  color:#333;
}

.note{
  font-size:.8rem;
  color:#777;
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script>
/* =====================================================
   🔧 CONFIGURAÇÃO (VOCÊ SÓ MEXE AQUI)
===================================================== */

var APP_CONFIG = {
  title: "Descubra o sexo do seu bebê 👶",
  subtitle: "Um teste divertido baseado em crenças populares 💕",

  shareTemplate: function(resultado, chance, url){
    return (
      "Fiz um teste divertido na gravidez 💕👶\n\n" +
      "Meu bebê provavelmente será " + resultado +
      " (" + chance + "%) ✨\n\n" +
      "Descubra o seu também 👉 " + url
    );
  }
};

/* =====================================================
   🧠 DADOS DO QUIZ
===================================================== */

var questions=[
 {q:"Qual sua idade?", o:[["Menos de 25",-1],["25 a 34",2],["35 ou mais",-1]]},
 {q:"Em que mês engravidou?", o:[["Jan a Abr",2],["Mai a Ago",-2],["Set a Dez",1]]},
 {q:"Desejo maior?", o:[["Doce 🍰",-2],["Salgado 🧂",2],["Equilibrado",0]]},
 {q:"Formato da barriga?", o:[["Pontuda",2],["Redonda",-2],["Não sei",0]]},
 {q:"Batimentos do bebê?", o:[["Rápidos",-2],["Calmos",2],["Não sei",0]]}
];

/* =====================================================
   ⚙️ ESTADO DO APP
===================================================== */

var app=document.getElementById("app");
var index=0;
var score=0;

/* =====================================================
   🖥️ TELAS
===================================================== */

function start(){
 app.innerHTML=
 "<h1>"+APP_CONFIG.title+"</h1>" +
 "<p>"+APP_CONFIG.subtitle+"</p>" +
 "<button onclick='quiz()'>Começar</button>";
}

function quiz(){
 var q=questions[index];
 var prog=(index/questions.length)*100;

 var html=
 "<div class='progress'><div class='progress-bar' style='width:"+prog+"%'></div></div>"+
 "<p>Pergunta "+(index+1)+" de "+questions.length+"</p>"+
 "<h2>"+q.q+"</h2>";

 for(var i=0;i<q.o.length;i++){
  html+="<button onclick='answer("+q.o[i][1]+")'>"+q.o[i][0]+"</button>";
 }

 app.innerHTML=html;
}

function answer(v){
 score+=v;
 index++;
 index<questions.length ? quiz() : loading();
}

function loading(){
 app.innerHTML=
 "<h3>Analisando com carinho 💗</h3>"+
 "<p>Aguarde um momentinho...</p>";

 setTimeout(result,2000);
}

function result(){
 var boy=score>0;
 var chance=Math.floor(Math.random()*26)+70;
 var resultado=boy?"MENINO 👶💙":"MENINA 👶💗";
 var frase=boy?
  "Um pequeno herói está a caminho 💙":
  "Uma princesinha cheia de amor está chegando 💗";

 var bg=boy?
 "linear-gradient(135deg,#b7d8f6,#e9f3ff)":
 "linear-gradient(135deg,#f6b7c5,#fde4ea)";

 var shareText = APP_CONFIG.shareTemplate(resultado, chance, location.href);

 app.innerHTML=
 "<div class='card-viral' style='background:"+bg+"'>"+
 "<p>✨ Meu resultado ✨</p>"+
 "<h1>"+resultado+"</h1>"+
 "<p>"+frase+"</p>"+
 "<p><strong>"+chance+"% de chance</strong></p>"+
 "<p style='font-size:.8rem'>Tire um print e poste nos Stories 📸</p>"+
 "</div>"+

 "<div class='share-buttons'>"+
 "<button onclick='shareWhatsApp(shareText)'>WhatsApp</button>"+
 "<button onclick='shareFacebook()'>Facebook</button>"+
 "<button onclick='shareX(shareText)'>X</button>"+
 "<button onclick='copyText(shareText)'>Copiar texto</button>"+
 "</div>"+

 "<button onclick='reset()'>Refazer teste</button>"+
 "<p class='note'>Teste recreativo · Não substitui exames médicos</p>";
}

/* =====================================================
   📤 COMPARTILHAMENTO
===================================================== */

function shareWhatsApp(text){
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

function shareFacebook(){
 window.open(
   "https://www.facebook.com/sharer/sharer.php?u=" +
   encodeURIComponent(location.href),
   "_blank"
 );
}

function shareX(text){
 window.open(
   "https://twitter.com/intent/tweet?text=" +
   encodeURIComponent(text),
   "_blank"
 );
}

function copyText(text){
 navigator.clipboard.writeText(text).then(function(){
   alert("Texto copiado! Cole nos Stories 📸✨");
 });
}

function reset(){
 index=0; score=0;
 start();
}

/* START */
start();
</script>

</body>
</html>
``
